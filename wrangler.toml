name = "tarheel-compass"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-07-03"
pages_build_output_dir = ".vercel/output/static"

[env.production.vars]
NEXTAUTH_URL="https://tarheelcompass.com"
PUBLIC_URL="https://tarheelcompass.com"
NEXT_PUBLIC_API_PATH="https://api.tarheelcompass.com"

[env.preview.vars]
NEXTAUTH_URL="https://preview.tarheelcompass.pages.dev"
PUBLIC_URL="https://preview.tarheelcompass.pages.dev"
NEXT_PUBLIC_API_PATH="https://api.preview.tarheelcompass.com"

[env.preview]
name = "preview"
[[env.preview.d1_databases]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "preview-db-tarheel-compass"
database_id = "8e064496-ce2f-48d2-81fb-e1fb5346b92d"

[env.production]
[[env.production.d1_databases]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "prod-db-tarheel-compass"
database_id = "786d9e50-3cd0-4401-8cd2-7ba56a734a74"